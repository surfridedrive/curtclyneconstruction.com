<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curt Clyne Construction</title>

  <!-- Basic SEO -->
  <meta name="description" content="Curt Clyne Construction — Home improvement consultants. Since 1982. Call to discuss, we'd love to chat!" />
  <link rel="canonical" href="https://curtclyneconstruction.com/" />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Curt Clyne Construction" />
  <meta property="og:description" content="Home improvement consultants. Since 1982. Call to discuss, we'd love to chat!" />
  <meta property="og:url" content="https://curtclyneconstruction.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Curt Clyne Construction" />
  <meta name="twitter:description" content="Home improvement consultants. Since 1982. Call to discuss, we'd love to chat!" />

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#0066cc" />

  <!-- Favicon (optional): add a /favicon.ico file or replace href with an external URL -->
  <link rel="icon" href="/favicon.ico" />

  <!-- JSON-LD structured data (LocalBusiness) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Curt Clyne Construction",
    "url": "https://curtclyneconstruction.com",
    "telephone": "+18082818706",
    "description": "Home improvement consultants. Since 1982. Call to discuss, we'd love to chat!"
  }
  </script>

  <style>
    :root{
      --bg: #f7f7f7;
      --card: #ffffff;
      --accent: #0066cc;
      --muted: #6b7280;
      --text: #0b2536;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      display:grid;
      place-items:center;
      background:var(--bg);
      color:var(--text);
      padding:1.25rem;
    }
    .card{
      background:var(--card);
      padding:2rem;
      border-radius:12px;
      box-shadow:0 8px 30px rgba(11,37,54,0.08);
      text-align:center;
      max-width:720px;
      width:100%;
    }
    h1{
      margin:0;
      font-size:1.5rem;
      letter-spacing: -0.01em;
    }
    .phone{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      margin-top:1rem;
      font-size:1.375rem;
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
      background:transparent;
      border:0;
      cursor:pointer;
    }
    .phone:focus,.phone:hover{opacity:.92; outline:4px solid rgba(0,102,204,0.08); border-radius:8px}
    .note{margin-top:0.5rem;color:var(--muted);font-size:0.95rem}
    .cta{
      margin-top:1.25rem;
      display:inline-block;
      background:var(--accent);
      color:#fff;
      padding:.6rem 1rem;
      border-radius:8px;
      text-decoration:none;
      font-weight:600;
    }
    .cta:focus,.cta:hover{opacity:.95}
    @media(min-width:640px){
      h1{font-size:2rem}
      .phone{font-size:2rem}
      .cta{font-size:1.125rem}
    }
    /* small skip link for accessibility */
    .skip { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
    .skip:focus { left: 10px; top: 10px; width:auto; height:auto; background:#fff; padding:.5rem; border-radius:4px; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <main id="main" class="card" role="main" aria-label="Curt Clyne Construction contact">
    <h1>Curt Clyne Construction</h1>

    <!-- Replace the number below with your real number in E.164 format for the tel: link (e.g. tel:+1234567890) -->
    <a class="phone" href="tel:+18082818706" aria-label="Call Curt Clyne Construction">
      <!-- optional phone icon (inline SVG) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 16.5v3a1.5 1.5 0 0 1-1.65 1.49c-2.03-.2-4.02-.98-5.8-2.21a17.1 17.1 0 0 1-5-5 12 12 0 0 1-2.2-5A1.5 1.5 0 0 1 6.5 2h3A1.5 1.5 0 0 1 11 3.5c0 1.2.2 2.4.6 3.6.4 1.2 1 2.3 1.8 3.3a1.5 1.5 0 0 1-.35 2.1L12.8 13a13 13 0 0 0 5 5l1.7-1.2a1.5 1.5 0 0 1 2.1.35c.9.8 2.1 1.4 3.3 1.8 1.2.4 2.4.6 3.6.6A1.5 1.5 0 0 1 21 16.5z" fill="currentColor"/>
      </svg>
      <span>+1 (808) 281-8706</span>
    </a>

    <p class="note">Call for estimates &amp; scheduling</p>

    <p>
      <a class="cta" href="tel:+18082818706" aria-label="Call now">Call Now</a>
    </p>

    <p class="note" style="margin-top:1rem;font-size:.9rem">
      Serving the local area. Licensed & insured.
    </p>
  </main>
